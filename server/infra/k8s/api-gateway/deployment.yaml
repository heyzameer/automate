# api-gateway — Kubernetes Deployment + Service
# Apply: kubectl apply -f infra/k8s/api-gateway/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: carbot
  labels:
    app: api-gateway
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v1
    spec:
      containers:
        - name: api-gateway
          image: carbot/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '512Mi'
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: carbot
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: carbot
data:
  NODE_ENV: "production"
  PORT: "5000"
  CORS_CREDENTIALS: "true"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX: "5000"
  LOG_LEVEL: "info"
  MAX_SIZE_LIMIT: "10mb"
  AUTH_SERVICE_URL: "http://auth-service:5001"
