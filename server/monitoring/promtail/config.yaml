server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: carbot-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: carbot-services
          __path__: /var/log/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            timestamp: timestamp
            correlationId: correlationId
      - labels:
          level:
          service:
          correlationId:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"
          location: "Asia/Kolkata"
