version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "5000:5000"
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  whatsapp-bot-service:
    build:
      context: .
      dockerfile: services/whatsapp-bot-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  campaign-service:
    build:
      context: .
      dockerfile: services/campaign-service/Dockerfile
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: orbix
      RABBITMQ_DEFAULT_PASS: orbixrabbit
    ports:
      - "5672:5672"
    networks:
      - orbix-mesh

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - orbix-mesh

networks:
  orbix-mesh:
    driver: bridge
