version: '3.8'

services:
  # Monolithic architecture: All microservices run in one container for low EC2 load
  orbix-monolith:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
      - "5006:5006"
    env_file: .env.prod
    restart: always
    networks:
      - orbix-mesh
    depends_on:
      - rabbitmq
      - elasticsearch

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: orbix
      RABBITMQ_DEFAULT_PASS: orbixrabbit
    networks:
      - orbix-mesh

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.1
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    networks:
      - orbix-mesh

networks:
  orbix-mesh:
    driver: bridge
