version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: carbot_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: carbot_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    container_name: carbot_redis
    ports:
      - "6379:6379"

  auth-service:
    build:
      context: ./server/auth-service
      dockerfile: Dockerfile
    container_name: auth_service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/carbot_auth
      - JWT_SECRET=supersecretjwtkeyforcarbotai2024
    depends_on:
      - mongodb
      - rabbitmq

  api-gateway:
    build:
      context: ./server/api-gateway
      dockerfile: Dockerfile
    container_name: api_gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/carbot_gateway
      - JWT_SECRET=supersecretjwtkeyforcarbotai2024
      - AUTH_SERVICE_URL=http://auth-service:5001
    depends_on:
      - auth-service

volumes:
  mongo_data:
