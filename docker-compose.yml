
services:
  # --- INFRASTRUCTURE ---
  mongodb:
    image: mongo:6
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carbot_net

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carbot_billing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carbot_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carbot_net

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - carbot_net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - carbot_net

  # --- BACKEND SERVICES ---
  auth-service:
    build:
      context: ./server
      dockerfile: services/auth-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/carbot_auth
      REDIS_URL: redis://redis:6379
      JWT_SECRET: supersecretjwtkeyforcarbotai2024
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carbot_net

  api-gateway:
    build:
      context: ./server
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "5000:5000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:5001
      INVENTORY_SERVICE_URL: http://inventory-service:5002
      BILLING_SERVICE_URL: http://billing-service:5008
    depends_on:
      - auth-service
    networks:
      - carbot_net

  inventory-service:
    build:
      context: ./server
      dockerfile: services/inventory-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/carbot_inventory
      RABBITMQ_URL: amqp://rabbitmq:5672
      ELASTICSEARCH_URL: http://elasticsearch:9200
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - carbot_net

  billing-service:
    build:
      context: ./server
      dockerfile: services/billing-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/carbot_billing
      AUTH_SERVICE_URL: http://auth-service:5001
      INVENTORY_SERVICE_URL: http://inventory-service:5002
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - carbot_net

  notification-service:
    build:
      context: ./server
      dockerfile: services/notification-service/Dockerfile
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - carbot_net

  whatsapp-bot-service:
    build:
      context: ./server
      dockerfile: services/whatsapp-bot-service/Dockerfile
    environment:
      MONGODB_URI: mongodb://mongodb:27017/carbot_bot
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - carbot_net


  # --- FRONTEND ---
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - carbot_net

networks:
  carbot_net:
    driver: bridge

volumes:
  mongo_data:
  postgres_data:
